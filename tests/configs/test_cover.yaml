---
esphome:
  name: tx-qemu-cover
  friendly_name: TX QEMU Cover Test
  includes:
    - qemu_stubs.h
  build_flags:
    - "-Wl,--wrap=rmt_tx_wait_all_done"
    - "-Wl,--wrap=rmt_transmit"

esp32:
  board: esp32dev
  # Each emulated flash write takes ~0.2 s, and the first boot from a clean flash saves ~35 preferences in one
  # loop pass: longer than the 5 s default task watchdog, whose reset then crash-loops under QEMU.
  watchdog_timeout: 30s
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  baud_rate: 115200

substitutions:
  name: tx-qemu-cover
  friendly_name: TX QEMU Cover Test
  device_format: EU
  # 3 gangs, so the touch positions of the shared harness helpers apply. Relay 3 stays a regular relay.
  gang_count: 3
  relay_1_mode: disabled  # Used by the cover (open)
  relay_2_mode: disabled  # Used by the cover (close)
  # Shorter than a full travel: the cover must ignore the pulse timer of its relays
  relay_1_pulse_time: '1'
  relay_2_pulse_time: '1'
  cover_open_duration: '3'
  cover_close_duration: '3'
  touch_uart_rx_pin: GPIO3
  touch_uart_tx_pin: GPIO1
  # Emulator timing jitter has stretched 50 ms taps to ~900 ms, past the 500 ms default.
  # Use a threshold well clear of that jitter; the long-press holds in the tests exceed it.
  BUTTON_LONG_PRESS_DELAY: "2000"

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - tx_ultimate_easy

wifi: !remove

ethernet:
  type: OPENETH

packages:
  core: !include ../../ESPHome/TX-Ultimate-Easy-ESPHome_core.yaml
  relays: !include ../../ESPHome/TX-Ultimate-Easy-ESPHome_hw_relays.yaml
  cover: !include ../../ESPHome/TX-Ultimate-Easy-ESPHome_cover.yaml
...
