esphome:
  name: tx-qemu-instant
  friendly_name: TX QEMU Instant Test
  includes:
    - qemu_stubs.h
  build_flags:
    - "-DINSTANT_CLICK_MODE_ACTIVE"
    - "-Wl,--wrap=rmt_tx_wait_all_done"
    - "-Wl,--wrap=rmt_transmit"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  baud_rate: 115200

substitutions:
  name: tx-qemu-instant
  friendly_name: TX QEMU Instant Test
  device_format: EU
  gang_count: 3
  instant_click_mode: true
  expose_relays_leds_to_ha: true
  touch_uart_rx_pin: GPIO3
  touch_uart_tx_pin: GPIO1

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - tx_ultimate_easy

wifi: !remove

ethernet:
  type: OPENETH

packages:
  core: !include ../../ESPHome/TX-Ultimate-Easy-ESPHome_core.yaml
  relays: !include ../../ESPHome/TX-Ultimate-Easy-ESPHome_hw_relays.yaml
