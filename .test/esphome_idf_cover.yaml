---
substitutions:
  device_format: ${ ["EU", "US"] | random }
  gang_count: ${ [2, 3, 4] | random }  # The cover requires 2 or more gangs
  relay_1_mode: disabled  # Used by the cover (open)
  relay_2_mode: disabled  # Used by the cover (close)

external_components:
  - source:
      type: local
      path: ../components
    components:
      - tx_ultimate_easy

packages:
  common_idf: !include common_idf.yaml
  core_package: !include ../ESPHome/TX-Ultimate-Easy-ESPHome_core.yaml
  standard_package: !include ../ESPHome/TX-Ultimate-Easy-ESPHome_standard.yaml
  cover_package: !include ../ESPHome/TX-Ultimate-Easy-ESPHome_cover.yaml
...
