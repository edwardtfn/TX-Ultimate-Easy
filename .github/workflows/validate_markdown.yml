---
name: Validate Markdown

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    paths:
      - '**/*.md'
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Ensures full commit history for diff

      - name: Identify changed files
        id: changed-files
        run: |
          BASE=${{ github.event.before }}
          HEAD=${{ github.sha }}
          FILES=$(git diff --name-only $BASE $HEAD -- '**/*.md' | tr '\n' ',')
          echo "changed_files=$FILES" >> $GITHUB_ENV
          if [[ -n "$FILES" ]]; then
            echo "any_changed=true" >> $GITHUB_ENV
          else
            echo "any_changed=false" >> $GITHUB_ENV
          fi

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        if: env.any_changed == 'true'
        with:
          globs: ${{ env.changed_files }}
          separator: ","
          config: '.rules/.markdownlint.jsonc'
          fix: true

  markdown-links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Identify changed files
        id: changed-files
        run: |
          BASE=${{ github.event.before }}
          HEAD=${{ github.sha }}
          FILES=$(git diff --name-only $BASE $HEAD -- '**/*.md' | tr '\n' ',')
          echo "changed_files=$FILES" >> $GITHUB_ENV
          if [[ -n "$FILES" ]]; then
            echo "any_changed=true" >> $GITHUB_ENV
          else
            echo "any_changed=false" >> $GITHUB_ENV
          fi

      - name: Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368  # v1
        if: env.any_changed == 'true'
        with:
          check-modified-files-only: yes
          config-file: '.rules/mlc_config.json'
          base-branch: 'main'
...
