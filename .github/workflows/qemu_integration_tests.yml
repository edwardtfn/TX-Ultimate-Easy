---
name: "🧪 QEMU Hardware Integration Tests"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - unified-gang-architecture
      - virtual-relays
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'
  pull_request:
    branches:
      - main
      - unified-gang-architecture
      - virtual-relays
      - 'test/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu_tests:
    name: "🖥️ QEMU Standalone Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: ⚙️ Install QEMU Runtime System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgcrypt20 \
            libglib2.0-0 \
            libpixman-1-0 \
            libsdl2-2.0-0 \
            libslirp0

      - name: ⚡ Download & Set Up Espressif QEMU
        run: |
          QEMU_URL="https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz"
          mkdir -p "$HOME/qemu-dist"
          echo "Downloading Espressif QEMU..."
          curl -sSL "$QEMU_URL" -o /tmp/qemu.tar.xz
          echo "Extracting..."
          tar -xf /tmp/qemu.tar.xz -C "$HOME/qemu-dist"

          # Dynamically locate the qemu-system-xtensa binary
          QEMU_BIN_PATH=$(find "$HOME/qemu-dist" -type f -name "qemu-system-xtensa" | head -n 1)
          if [ -z "$QEMU_BIN_PATH" ]; then
            echo "::error::qemu-system-xtensa executable not found in archive"
            exit 1
          fi
          chmod +x "$QEMU_BIN_PATH"
          echo "Found QEMU binary at: $QEMU_BIN_PATH"
          "$QEMU_BIN_PATH" --version

          QEMU_DIR=$(dirname "$QEMU_BIN_PATH")
          echo "$QEMU_DIR" >> $GITHUB_PATH
          echo "QEMU_BIN=$QEMU_BIN_PATH" >> $GITHUB_ENV

      - name: 🧪 Execute Standalone QEMU Integration Test Suite
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python run_tests.py -v
...
