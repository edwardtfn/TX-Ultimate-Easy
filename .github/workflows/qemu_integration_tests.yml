---
name: QEMU Integration Tests

permissions:
  contents: read

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - ".github/workflows/qemu_integration_tests.yml"
      - "components/**"
      - "ESPHome/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements-test.txt"
      - "run_tests.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qemu_tests:
    name: QEMU Standalone Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install QEMU runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgcrypt20 \
            libglib2.0-0 \
            libpixman-1-0 \
            libsdl2-2.0-0 \
            libslirp0

      - name: Download and set up Espressif QEMU
        run: |
          QEMU_URL="https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz"
          mkdir -p "$HOME/qemu-dist"
          echo "Downloading Espressif QEMU..."
          QEMU_SHA256="0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35"
          curl -fsSL "$QEMU_URL" -o /tmp/qemu.tar.xz
          echo "${QEMU_SHA256}  /tmp/qemu.tar.xz" | sha256sum -c -
          echo "Extracting..."
          tar -xf /tmp/qemu.tar.xz -C "$HOME/qemu-dist"

          # Dynamically locate the qemu-system-xtensa binary
          QEMU_BIN_PATH=$(find "$HOME/qemu-dist" -type f -name "qemu-system-xtensa" | head -n 1)
          if [ -z "$QEMU_BIN_PATH" ]; then
            echo "::error::qemu-system-xtensa executable not found in archive"
            exit 1
          fi
          chmod +x "$QEMU_BIN_PATH"
          echo "Found QEMU binary at: $QEMU_BIN_PATH"
          "$QEMU_BIN_PATH" --version

          QEMU_DIR=$(dirname "$QEMU_BIN_PATH")
          echo "$QEMU_DIR" >> "$GITHUB_PATH"
          echo "QEMU_BIN=$QEMU_BIN_PATH" >> "$GITHUB_ENV"

      - name: Build test firmware only (TEMP)
        run: |
          python -c "from tests.builder import ensure_all_test_assets, DEFAULT_BUILD_CACHE_DIR; ensure_all_test_assets(); print(DEFAULT_BUILD_CACHE_DIR)"
          mkdir -p fw && for t in test_standard test_instant test_light; do cp "$(python -c 'from tests.builder import DEFAULT_BUILD_CACHE_DIR; print(DEFAULT_BUILD_CACHE_DIR)')/$t/build/firmware.factory.bin" "fw/$t.factory.bin"; done; ls -la fw

      - name: Upload test firmware (TEMP)
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-firmware
          path: fw/
          retention-days: 1
...
