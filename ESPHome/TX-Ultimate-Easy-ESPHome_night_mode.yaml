####################################################################################################
#####                              TX Ultimate Easy for ESPHome                                #####
#####                  Repository: https://github.com/edwardtfn/TX-Ultimate-Easy               #####
####################################################################################################
##### Purpose: Night Mode — persistent LED/vibration/sound override                            #####
####################################################################################################
##### Author: ghigo - https://github.com/ghigo                                                 #####
####################################################################################################
##### All "Night Mode" entities appear together on the HA device page.                         #####
##### Main switch has no entity_category (prominent).                                          #####
##### Setting entities use entity_category: config (grouped under Configuration).              #####
####################################################################################################
---
substitutions:
  night_mode_light_transition_length: 500ms
  night_mode_sync_leds_delay: 20ms
  # Safety bound for the fade-out wait; must be longer than the transition itself.
  night_mode_light_off_timeout: 2s
  night_mode_light_default_transition_length: 0s

  night_mode_red: '80%'
  night_mode_green: '50%'
  night_mode_blue: '0%'
  night_mode_brightness: '15%'

esphome:
  build_flags:
    - -D TX_ULTIMATE_EASY_NIGHT_MODE
  on_boot:
    - priority: -200  # Ensures all hardware components are ready before we touch LEDs.
      then:
        - script.execute: night_mode_apply

preferences:
  flash_write_interval: 1s

output:
  # No-op outputs backing the virtual color picker.
  # The rgb light platform requires float outputs; these intentionally do nothing
  - id: out_night_mode
    platform: template
    type: float
    write_action:
      - script.execute: night_mode_sync_leds

light:
  # Virtual RGB color picker — stores color preference, never drives hardware.
  # lights_all is intentionally left untouched by night mode.
  - id: light_night_mode
    name: "Night Mode - Color"
    platform: rgb
    red: out_night_mode
    green: out_night_mode
    blue: out_night_mode
    icon: mdi:weather-night
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: ${night_mode_light_default_transition_length}
    initial_state:
      color_mode: RGB
      red: ${night_mode_red}
      green: ${night_mode_green}
      blue: ${night_mode_blue}
      brightness: ${night_mode_brightness}

  # Internal partition that drives the physical strip while Night Mode is active.
  - id: light_night_mode_leds
    platform: partition
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    segments:
      - id: light_full
        from: 0
        to: ${LIGHT_MAX_ADDR}

script:
  # Apply the stored night mode color/brightness to the night mode light.
  # Waits for relay boot initialization so it is safe to call from on_boot.
  - id: night_mode_apply
    then:
      - if:
          condition:
            lambda: "return sw_night_mode->state;"
          then:
            # Bounded wait for relay boot initialization. script.wait has no timeout, so
            # wait_until is used as defense-in-depth against an indefinite block on boot.
            - wait_until:
                condition:
                  lambda: return id(boot_initialization_relays);
                timeout: 10s
            # Re-check the flag: night mode may have been disabled while we were waiting.
            - if:
                condition:
                  lambda: "return sw_night_mode->state;"
                then:
                  - light.turn_on:
                      id: light_night_mode_leds
                      red: !lambda "return id(light_night_mode).current_values.get_red();"
                      green: !lambda "return id(light_night_mode).current_values.get_green();"
                      blue: !lambda "return id(light_night_mode).current_values.get_blue();"
                      brightness: !lambda "return id(light_night_mode).current_values.get_brightness();"
                      transition_length: ${night_mode_light_transition_length}

  # Called by each template output write_action whenever the color picker value changes.
  # Debounced so the three channel writes (R, G, B) collapse into one LED update.
  # Only applies to hardware when night mode is active.
  - id: night_mode_sync_leds
    mode: restart
    then:
      - delay: ${night_mode_sync_leds_delay}
      - if:
          condition:
            lambda: "return sw_night_mode->state;"
          then:
            - light.turn_on:
                id: light_night_mode_leds
                red: !lambda "return id(light_night_mode).current_values.get_red();"
                green: !lambda "return id(light_night_mode).current_values.get_green();"
                blue: !lambda "return id(light_night_mode).current_values.get_blue();"
                brightness: !lambda "return id(light_night_mode).current_values.get_brightness();"
                transition_length: ${night_mode_light_transition_length}

switch:
  # ── Main control (no entity_category → appears in main entity list) ───────
  - id: sw_night_mode
    name: "Night Mode"
    platform: template
    icon: mdi:weather-night
    internal: false
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: night_mode_apply
    on_turn_off:
      then:
        # Stop the apply script in case we are in the middle of a transition.
        # The snapshot globals are intentionally left untouched - they are
        # overwritten the next time night mode is enabled.
        - script.stop: night_mode_apply
        - light.turn_off:
            id: light_night_mode_leds
            transition_length: ${night_mode_light_transition_length}
        # The night mode partition spans the whole strip and keeps writing to it
        # until the fade-out completes, so an earlier repaint would be overwritten.
        # The timeout is defense-in-depth only: it should never be reached.
        - wait_until:
            condition:
              - light.is_off: light_night_mode_leds
            timeout: ${night_mode_light_off_timeout}
        - script.execute: show_relay_status  # re-evaluate all relay indicators

  # ── Settings (entity_category: config → grouped under "Configuration") ────
  - id: sw_night_mode_suppress_vibration
    name: "Night Mode - Suppress Vibration"
    platform: template
    entity_category: config
    icon: mdi:vibrate-off
    internal: false
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - id: sw_night_mode_suppress_sound
    name: "Night Mode - Suppress Sound"
    platform: template
    entity_category: config
    icon: mdi:volume-off
    internal: false
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
...
